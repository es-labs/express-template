issuer: http://127.0.0.1:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true
  responseTypes:
    - code

staticClients:
  - id: test-client
    redirectURIs:
      - http://127.0.0.1:3001/api/oidc/auth
    name: Test OIDC Client
    secret: test-secret

enablePasswordDB: true
staticPasswords:
  - email: test@example.com
    # bcrypt hash of "password" (cost 10) — from dex official example
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: testuser
    userID: test-user-001
