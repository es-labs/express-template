services:
  simplesamlphp:
    image: kenchan0130/simplesamlphp:latest
    ports:
      - "8080:8080"
    environment:
      SIMPLESAMLPHP_SP_ENTITY_ID: http://127.0.0.1:3001/saml
      SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE: http://127.0.0.1:3001/api/saml/callback
    volumes:
      - ./authsources.php:/var/www/simplesamlphp/config/authsources.php:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/simplesaml/saml2/idp/metadata.php || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
